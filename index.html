            {"@type": "Question", "name": "What is a recovery house and do I need one after surgery?", "acceptedAnswer": {"@type": "Answer", "text": "A recovery house is a short-term furnished accommodation specifically designed for post-surgical patients. Unlike a hotel or Airbnb, recovery houses offer medical-grade beds, nursing access, meal preparation, medication management, and daily check-ins. After most surgical procedures, a recovery house is strongly recommended for the first 7–14 days to reduce complication risk and ensure proper healing."}},

            {"@type": "Question", "name": "How long do I need to stay in Mérida after bariatric or orthopedic surgery?", "acceptedAnswer": {"@type": "Answer", "text": "Most bariatric surgery patients (gastric sleeve) need 7–10 days in Mérida post-procedure. Orthopedic procedures like hip or knee replacement typically require 10–14 days. Your surgeon will provide a personalized recovery timeline and travel clearance before you fly home."}},
            {"@type": "Question", "name": "Can I fly home after surgery in Mexico — how long should I wait?", "acceptedAnswer": {"@type": "Answer", "text": "Flying after surgery depends on the procedure. For dental implants, most patients can fly within 2–3 days. Bariatric surgery: 7–10 days. Plastic surgery (tummy tuck, etc.): 10–14 days. Orthopedic (hip/knee): 10–14 days. LASIK: 3–5 days. Your surgeon provides written travel clearance."}},
            {"@type": "Question", "name": "What post-op care is available for medical tourists in Mérida?", "acceptedAnswer": {"@type": "Answer", "text": "RecoverMerida provides a full post-op care system: 24/7 AI-powered WhatsApp monitoring that tracks symptoms and alerts nursing staff, recovery-certified housing with medical-grade amenities, bilingual coordination between you and your surgical team, daily wellness check-ins, meal preparation, medication management, physical therapy coordination, and 30-day remote monitoring after you fly home."}},

            {"@type": "Question", "name": "Where do snowbirds typically go for surgery in Mexico — why is Mérida different?", "acceptedAnswer": {"@type": "Answer", "text": "Most snowbirds considering surgery in Mexico look at Tijuana, Cancún, or Guadalajara. Mérida is different for three reasons: (1) it has the highest concentration of JCI-accredited hospitals per capita in southeastern Mexico, (2) it's the safest major city in Mexico with a 10,000+ expat community, and (3) it now has a dedicated recovery infrastructure for international patients."}},
